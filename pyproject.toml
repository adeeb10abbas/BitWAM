[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "lerobot-policy-bitwam"
version = "0.1.0"
description = "Ternary VLA-JEPA policy plugin for LeRobot"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Ali Adeeb" }]
dependencies = [
  "lerobot[vla_jepa,training,libero]==0.6.2",
  "pyyaml>=6.0.2,<7",
  "safetensors>=0.6,<1",
  "torch==2.11.0",
  "torchvision==0.26.0",
]

[project.scripts]
bitwam = "lerobot_policy_bitwam.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.14.1,<0.15",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
lerobot = { git = "https://github.com/huggingface/lerobot.git", rev = "6adf51511b7625090eade8d82d9f61a1846ebe56" }
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.hatch.build.targets.wheel]
packages = ["src/lerobot_policy_bitwam"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = [".python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
